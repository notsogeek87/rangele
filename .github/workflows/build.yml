name: Build

on:
  # Toutes les branches, pas seulement staging/main : c'est ce qui permet de valider une branche de
  # travail AVANT de la fusionner. Tant que la CI ne tournait que sur staging/main, le premier retour
  # sur la compilation et les tests arrivait une fois le code déjà sur une branche de livraison —
  # d'où les builds KO en série. Les APK et les releases, eux, restent réservés à staging/main.
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

# Un nouveau push sur une branche de travail annule le run précédent (retour plus rapide, moins de
# runners occupés) ; sur staging/main les runs sont conservés, chacun publiant sa propre release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'staging' && github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publication (APK + releases) uniquement depuis les branches de livraison.
      PUBLISH: ${{ github.ref_name == 'staging' || github.ref_name == 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build identifiers
        id: ids
        run: |
          echo "sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          # Un nom d'artifact ne peut pas contenir "/" : `claude/ma-branche` deviendrait invalide.
          echo "ref_slug=$(echo "${{ github.ref_name }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run unit tests (staging + production debug variants)
        run: ./gradlew testStagingDebugUnitTest testProductionDebugUnitTest --no-daemon

      - name: Build debug APKs (staging + production variants)
        run: ./gradlew assembleDebug --no-daemon

      - name: Read app version name
        id: version
        run: |
          version="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]*)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Rename APKs for this commit
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p artifact
          find_apk() {
            find app/build/outputs/apk/"$1"/debug -name '*.apk' -print -quit
          }
          staging_apk="$(find_apk staging)"
          production_apk="$(find_apk production)"
          if [ -z "$staging_apk" ] || [ -z "$production_apk" ]; then
            echo "::error::Could not find built APK (staging: '$staging_apk', production: '$production_apk')"
            exit 1
          fi
          # Copie horodatée par commit, gardée comme artifact de run (voir CLAUDE.md).
          cp "$staging_apk" "artifact/inventaire-placard-staging-${{ steps.ids.outputs.sha }}.apk"
          cp "$production_apk" "artifact/inventaire-placard-main-${{ steps.ids.outputs.sha }}.apk"
          # Nom Yakwa-<version>-<build>, attaché à une release dédiée à ce build (voir plus bas) :
          # chaque push obtient sa propre release, pas un asset partagé qu'on écrase.
          cp "$staging_apk" "artifact/Yakwa-Staging-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk"
          cp "$production_apk" "artifact/Yakwa-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk"

      - name: Upload staging APK
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-placard-staging-${{ steps.ids.outputs.sha }}
          path: artifact/inventaire-placard-staging-${{ steps.ids.outputs.sha }}.apk
          if-no-files-found: error

      - name: Upload main APK
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-placard-main-${{ steps.ids.outputs.sha }}
          path: artifact/inventaire-placard-main-${{ steps.ids.outputs.sha }}.apk
          if-no-files-found: error

      - name: Publish staging release for this build
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-v${{ steps.version.outputs.value }}-${{ github.run_number }}
          name: "Yakwa Staging ${{ steps.version.outputs.value }} (build ${{ github.run_number }})"
          prerelease: true
          files: artifact/Yakwa-Staging-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk
          body: |
            Build automatique depuis le commit `${{ steps.ids.outputs.sha }}` (branche `${{ github.ref_name }}`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish main release for this build
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}-${{ github.run_number }}
          name: "Yakwa ${{ steps.version.outputs.value }} (build ${{ github.run_number }})"
          prerelease: false
          files: artifact/Yakwa-${{ steps.version.outputs.value }}-${{ github.run_number }}.apk
          body: |
            Build automatique depuis le commit `${{ steps.ids.outputs.sha }}` (branche `${{ github.ref_name }}`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.ids.outputs.ref_slug }}-${{ github.run_number }}
          path: |
            app/build/reports/tests
            app/build/reports/ktlint
          if-no-files-found: ignore
