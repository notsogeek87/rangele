name: Build

on:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin lint (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run unit tests (staging + production variants)
        run: ./gradlew test --no-daemon

      - name: Build debug APKs (staging + production variants)
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute short commit SHA
        id: sha
        run: echo "value=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Rename APKs for this commit
        run: |
          mkdir -p artifact
          find_apk() {
            find app/build/outputs/apk/"$1"/debug -name '*.apk' -print -quit
          }
          staging_apk="$(find_apk staging)"
          production_apk="$(find_apk production)"
          if [ -z "$staging_apk" ] || [ -z "$production_apk" ]; then
            echo "::error::Could not find built APK (staging: '$staging_apk', production: '$production_apk')"
            exit 1
          fi
          cp "$staging_apk" "artifact/inventaire-placard-staging-${{ steps.sha.outputs.value }}.apk"
          cp "$production_apk" "artifact/inventaire-placard-main-${{ steps.sha.outputs.value }}.apk"

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-placard-staging-${{ steps.sha.outputs.value }}
          path: artifact/inventaire-placard-staging-${{ steps.sha.outputs.value }}.apk
          if-no-files-found: error

      - name: Upload main APK
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-placard-main-${{ steps.sha.outputs.value }}
          path: artifact/inventaire-placard-main-${{ steps.sha.outputs.value }}.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/reports/tests
            app/build/reports/ktlint
          if-no-files-found: ignore
